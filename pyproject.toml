[project]
name = "agent-memory"
version = "0.1.0"
description = "Bootstrap and maintain scoped, self-updating project memory for coding agents."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = ["codex", "agent", "memory", "skill", "llm"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py37"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
