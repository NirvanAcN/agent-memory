stages:
  - test

.test_template:
  stage: test
  before_script:
    - python --version
    - python -m pip install "ruff>=0.4"
  script:
    - ruff check .
    - python -m unittest scripts/test_memory.py
    - python scripts/bootstrap_memory.py --project-root "$CI_PROJECT_DIR/.ci-demo" --feature Demo --agents
    - python scripts/validate_memory.py --project-root "$CI_PROJECT_DIR/.ci-demo"

test:python3.7:
  extends: .test_template
  image: python:3.7-slim

test:python3.8:
  extends: .test_template
  image: python:3.8-slim

test:python3.9:
  extends: .test_template
  image: python:3.9-slim

test:python3.10:
  extends: .test_template
  image: python:3.10-slim

test:python3.11:
  extends: .test_template
  image: python:3.11-slim

test:python3.12:
  extends: .test_template
  image: python:3.12-slim
